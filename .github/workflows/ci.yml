name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create empty Secrets.xcconfig
        run: touch Secrets.xcconfig

      - name: Generate Secrets.swift
        run: bash scripts/generate-secrets.sh
        env:
          SRCROOT: ${{ github.workspace }}

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Quack.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: |
          xcodebuild -project Quack.xcodeproj \
            -scheme Quack \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Test
        run: |
          xcodebuild -project Quack.xcodeproj \
            -scheme QuackKitTests \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            test

      # ditto preserves the bundle's symlinks and permissions; letting
      # upload-artifact zip the .app directory itself does not.
      - name: Package app
        run: |
          ditto -c -k --keepParent \
            build/Build/Products/Debug/Quack.app \
            Quack-debug.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Quack-debug
          path: Quack-debug.zip
          retention-days: 14
