name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create empty Secrets.xcconfig
        run: touch Secrets.xcconfig

      - name: Generate Secrets.swift
        run: bash scripts/generate-secrets.sh
        env:
          SRCROOT: ${{ github.workspace }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      - name: Build
        run: |
          xcodebuild -project Quack.xcodeproj \
            -scheme Quack \
            -destination 'platform=macOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            build

      # ditto preserves the bundle's symlinks and permissions.
      - name: Package app
        run: |
          ditto -c -k --keepParent \
            build/Build/Products/Release/Quack.app \
            Quack-${{ github.ref_name }}.zip

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          files: Quack-${{ github.ref_name }}.zip
          draft: true
          generate_release_notes: true
          body: |
            Built by CI, ad-hoc signed and **not notarized**. macOS will refuse
            to open it until the quarantine attribute is removed:

            ```
            xattr -d com.apple.quarantine Quack.app
            ```
